<head>
<meta charset="utf-8" />

<title>Neuro-Fit — a camera form coach for squats</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<!-- site.css scopes every reveal-on-scroll hidden state behind `.js`. React
     guarantees JS is running, but the class still has to be set for those rules
     to apply at all — removing this leaves every `.reveal` permanently visible
     and kills the staggered entrance. -->
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
